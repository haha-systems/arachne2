name: Silk 2 Rust workspace

on:
  push:
    paths:
      - "silk2/**"
      - ".github/workflows/silk2.yml"
  pull_request:
    paths:
      - "silk2/**"
      - ".github/workflows/silk2.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Copy the independent project
        run: cp -R silk2 "$RUNNER_TEMP/silk2"
      - name: Format
        working-directory: ${{ runner.temp }}/silk2
        run: cargo fmt --all --check
      - name: Lint
        working-directory: ${{ runner.temp }}/silk2
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build
        working-directory: ${{ runner.temp }}/silk2
        run: cargo build --workspace
      - name: Test
        working-directory: ${{ runner.temp }}/silk2
        run: cargo test --workspace -- --nocapture
